<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaderboard · Monsterdle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-top">
      <h1 class="logo"><a href="/"><span>Monsterdle</span></a></h1>
      <nav class="site-nav" id="site-nav" aria-label="Site"></nav>
    </div>
  </header>

  <main class="wide">
    <h2 class="page-title">Leaderboard</h2>
    <nav class="tabs" id="mode-tabs" aria-label="Mode"></nav>
    <p class="muted" style="text-align:left">
      Daily streak: daily puzzles solved in a row, one per day (a missed or skipped day ends it).
      Endless streak: endless monsters guessed in a row. "Current" is the streak still going; "best ever" is the highest it's been.
    </p>
    <div id="boards" class="boards"><p class="empty">Loading…</p></div>
    <div id="wins-board" class="boards" style="margin-top:12px"></div>
    <p id="join" class="muted" hidden style="margin-top:20px">
      <a href="/login.html#register">Create an account</a> to get your name up here.
    </p>
  </main>

  <script type="module" src="leaderboard.js"></script>
</body>
</html>
