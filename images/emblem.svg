<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150">
  <!-- The fleur-de-lis with crossed arrows that sits above the MONSTERDLE plaque. -->
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g stroke-linecap="round">
    <!-- arrows -->
    <g stroke="#14161c" stroke-width="5">
      <path d="M38 18 L120 120"/><path d="M162 18 L80 120"/>
    </g>
    <g fill="#b3121b" stroke="#3a0407" stroke-width="1.5">
      <path d="M30 8 l14 6 l-4 4 l6 8 l-6 4 l-6-8 l-4 4z"/>
      <path d="M170 8 l-14 6 l4 4 l-6 8 l6 4 l6-8 l4 4z"/>
    </g>
    <g fill="#14161c" stroke="#5f6670" stroke-width="1.2">
      <path d="M38 18 l-12 -4 l4 12z"/><path d="M162 18 l12 -4 l-4 12z"/>
    </g>
  </g>
  <!-- fleur-de-lis -->
  <g filter="url(#glow)" fill="#1a2440" stroke="#5d93ea" stroke-width="2.2" stroke-linejoin="round">
    <path d="M100 6 C116 28 118 52 100 78 C82 52 84 28 100 6Z"/>
    <path d="M95 74 C82 44 54 40 48 60 C44 74 60 84 70 74 C61 74 59 64 68 61 C78 58 86 68 92 82Z"/>
    <path d="M105 74 C118 44 146 40 152 60 C156 74 140 84 130 74 C139 74 141 64 132 61 C122 58 114 68 108 82Z"/>
    <rect x="76" y="80" width="48" height="10" rx="3"/>
    <path d="M100 90 C95 104 86 114 76 126 L100 116 L124 126 C114 114 105 104 100 90Z"/>
  </g>
  <!-- red leaves around the base -->
  <g fill="#b3121b" stroke="#3a0407" stroke-width="1">
    <path d="M70 100 c-10 2 -16 10 -18 18 c8 -2 15 -8 18 -18z"/>
    <path d="M130 100 c10 2 16 10 18 18 c-8 -2 -15 -8 -18 -18z"/>
    <path d="M100 128 c-4 6 -4 12 0 18 c4 -6 4 -12 0 -18z"/>
  </g>
</svg>
